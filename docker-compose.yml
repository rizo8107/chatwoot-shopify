services:
  chatwoot-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatwoot-automation
    ports:
      - "3000:3000"
    # Data lives in standalone PostgreSQL — no local volume needed.
    environment:
      - APP_PORT=3000
      # PostgreSQL connection — provided via .env (not committed). See .env.example.
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL:-true}
      # Optional fallbacks; live values are stored in the PostgreSQL `settings` table.
      - CHATWOOT_API_URL=https://chat.stomatalfarms.com
      - CHATWOOT_ACCOUNT_ID=1
      - CHATWOOT_INBOX_ID=1
    restart: unless-stopped
